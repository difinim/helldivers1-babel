name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0, defaults to tag or 1.0.0)'
        type: string
        default: '1.0.0'
      create_release:
        description: 'Create a GitHub Release'
        type: boolean
        default: true
      draft:
        description: 'Create as Draft Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup MSYS2 Clang, GCC and Make toolchain
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-clang mingw-w64-x86_64-gcc mingw-w64-x86_64-make
          path-type: inherit

      - name: Add MinGW64 to PATH
        shell: pwsh
        run: |
          $msysLocation = "${{ steps.msys2.outputs.msys2-location }}"
          if (-not $msysLocation -or -not (Test-Path $msysLocation)) {
              if (Test-Path "C:\msys64") {
                  $msysLocation = "C:\msys64"
              } elseif (Test-Path "$env:RUNNER_TEMP\msys64") {
                  $msysLocation = "$env:RUNNER_TEMP\msys64"
              }
          }
          Write-Host "MSYS2 Location resolved to: $msysLocation"
          $mingwBin = Join-Path $msysLocation "mingw64\bin"
          $usrBin = Join-Path $msysLocation "usr\bin"
          Write-Host "Adding to GITHUB_PATH: $mingwBin"
          Add-Content -Path $env:GITHUB_PATH -Value $mingwBin
          Add-Content -Path $env:GITHUB_PATH -Value $usrBin

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Verify build toolchain
        shell: pwsh
        run: |
          Write-Host "=== Toolchain Verification ===" -ForegroundColor Cyan
          Write-Host "Checking .NET SDK:"
          dotnet --version
          dotnet --list-sdks

          Write-Host "`nChecking Clang++ compiler:"
          $clang = Get-Command clang++ -ErrorAction Stop
          Write-Host "Found clang++: $($clang.Source)"
          & clang++ --version

          Write-Host "`nChecking MinGW Make:"
          $make = Get-Command mingw32-make -ErrorAction Stop
          Write-Host "Found mingw32-make: $($make.Source)"
          & mingw32-make --version

          Write-Host "`nChecking LuaJIT 2.0 submodule:"
          if (-not (Test-Path "./vendor/luajit/src/Makefile")) {
              Write-Error "vendor/luajit submodule is missing!"
              exit 1
          }
          Write-Host "Found vendor/luajit submodule"

          Write-Host "`n[OK] All build dependencies verified." -ForegroundColor Green

      - name: Run build script with dynamic version
        shell: pwsh
        run: |
          $rawTag = "${{ github.ref_name }}"
          if ($rawTag -and $rawTag.StartsWith('v')) {
              $version = $rawTag.Substring(1)
          } elseif (-not [string]::IsNullOrWhiteSpace("${{ inputs.version }}")) {
              $version = "${{ inputs.version }}".TrimStart('v')
          } else {
              $version = "1.0.0"
          }
          Write-Host "Building Helldivers 1 Babel version: $version" -ForegroundColor Cyan
          pwsh -File ./build.ps1 -Configuration Release -Version $version
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compress distribution package
        shell: pwsh
        run: |
          $version = $env:APP_VERSION
          if (-not $version) { $version = "1.0.0" }
          $distFolder = "dist/Helldivers1Babel-v$version"
          if (-not (Test-Path $distFolder)) {
              Write-Error "Distribution folder $distFolder not found"
              exit 1
          }
          $zipName = "Helldivers1Babel-v$version-win-x64.zip"
          Write-Host "Compressing $distFolder into $zipName..." -ForegroundColor Cyan
          Compress-Archive -Path "$distFolder\*" -DestinationPath $zipName -Force
          "RELEASE_ZIP=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Helldivers1Babel-v${{ env.APP_VERSION }}-win-x64
          path: ${{ env.RELEASE_ZIP }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v3
        with:
          name: Helldivers 1 Babel v${{ env.APP_VERSION }}
          files: ${{ env.RELEASE_ZIP }}
          draft: ${{ github.event.inputs.draft || false }}
          generate_release_notes: true
